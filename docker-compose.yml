services:
  database:
    image: postgres:16
    container_name: graduatelink_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: graduatelink
      POSTGRES_USER: graduatelink
      POSTGRES_PASSWORD: graduatelink_dev_password
    ports:
      - "5433:5432"
    volumes:
      - graduatelink_data:/var/lib/postgresql/data

volumes:
  graduatelink_data: